{{ define "main" }}
<section class="page-head">
  <div class="wrap">
    <h1>{{ .Title | lower }}</h1>
    <p class="page-desc">explore all topics and categories.</p>
  </div>
</section>

<div class="wrap">
  <div class="terms-cloud">
    {{ range .Data.Terms.ByCount }}
    <a href="{{ .Page.Permalink }}" class="term-pill">
      <span>#{{ .Page.Title }}</span>
      <span class="term-count">{{ .Count }}</span>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
